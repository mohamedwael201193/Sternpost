# Drift gate for the test-count numbers (task 0.8, plan §7.1 / C12).
#
# README.md, app/src/landing/Proof.tsx and judges/JUDGES.md carry numbers
# generated from TESTS.json by scripts/sync-proof.mjs. This job fails if
# any of those numbers differs from the committed TESTS.json, so the docs
# can never quietly drift from the last real `make test-all` run.
#
# Deliberately cheap: it reads the committed TESTS.json and diffs the
# numbers — it does NOT re-run any suite (the per-package workflows run
# the suites themselves). Fork rows are skipped while the fork suites in
# TESTS.json are "not-run"; sync-proof warns about that instead of
# failing, so a fork run is never claimed that did not happen.
#
# NO path filter, deliberately (J3-F4): a `paths:` filter blinded this
# gate to exactly the merges that stale the numbers — a gov-chain or
# backend merge touches none of the listed files, so stale counts
# shipped green. The job is ~30 s, so it runs on every push and PR.
# `make check-tests` also fails on a red or stale TESTS.json now, not
# just on drift, so a merge that breaks tests or moves counts without
# re-running `make test-all` cannot land green.
name: tests-drift

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: make check-tests
