name: sdk
on:
  push: { branches: [main], paths: ["sdk/**", "shared/**", ".github/workflows/sdk.yml"] }
  pull_request: { paths: ["sdk/**"] }
permissions: { contents: read }
jobs:
  sdk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: sdk } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: sdk/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
