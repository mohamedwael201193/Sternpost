name: mcp
on:
  push: { branches: [main], paths: ["mcp/**", "shared/**", ".github/workflows/mcp.yml"] }
  pull_request: { paths: ["mcp/**"] }
permissions: { contents: read }
jobs:
  mcp:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mcp } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm, cache-dependency-path: mcp/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
